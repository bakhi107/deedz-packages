name: DEEDZ Testnet Protocol Keeper

on:
  # Cloudflare dispatches this workflow every 15 minutes. One scheduler avoids duplicates.
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Verify the new testnet suite and claim any funded sample rewards"
        type: boolean
        default: false

concurrency:
  group: deedz-testnet-protocol-keeper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    env:
      DEEDZ_KEEPER_PERSIST_GIT: "1"
      DEEDZ_KEEPER_EXECUTE: "1"
      DEEDZ_KEEPER_DATA: keeper-data/stock-testnet
      DEEDZ_STOCK_MANIFEST: deployments/robinhood-testnet-stock.json
      ROBINHOOD_TESTNET_RPC_URL: https://rpc.testnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Validate keeper secret
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: test -n "$PRIVATE_KEY"
      - run: npm ci --no-audit --no-fund
      - run: npm run compile
      - run: node --test scripts/testnet-keeper-state.test.mjs scripts/stock/rpc-read-retry.test.mjs
      - name: Configure durable keeper checkpoints
        run: |
          git config user.name "deedz-keeper"
          git config user.email "keeper@deedz.invalid"
      - name: Buy stocks and register wallet credits when the three-hour cycle is due
        run: npm run operate:stock-keeper
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          DEEDZ_KEEPER_ACTION: cycle
      - name: Settle completed rent weeks and reinvest liquidity
        run: npm run operate:stock-keeper
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          DEEDZ_KEEPER_ACTION: sunday
      - name: Verify sample rewards
        if: ${{ inputs.smoke_test }}
        run: npx hardhat run --no-compile scripts/stock/testnet-smoke.ts
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          DEEDZ_TESTNET_SMOKE: "1"
          DEEDZ_SMOKE_PHASE: verify
      - name: Publish public recovery data
        if: ${{ always() }}
        run: |
          git add -A -- keeper-data/stock-testnet
          if ! git diff --cached --quiet -- keeper-data/stock-testnet; then
            git commit -m "Checkpoint new testnet stock keeper" -- keeper-data/stock-testnet
            git push origin HEAD
          fi
